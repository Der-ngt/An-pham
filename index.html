<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chào mừng đến với ấn phẩm KVA3 🌸</title>

  <!-- Nhập Font chữ Việt hóa ngọt ngào từ Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --pink-light: #fff5f7;
      --pink-soft: #ffe4eb;
      --pink: #f6a8bc;
      --pink-dark: #c75b78;
      --cream: #fffaf4;
      --text: #5b4b50;
      --white: #ffffff;
      --shadow: 0 15px 40px rgba(190, 105, 130, 0.15);
      
      /* Khai báo Font chính */
      --font-body: 'Comfortaa', cursive, sans-serif;
      --font-heading: 'Comfortaa', cursive;
    }

    body {
      min-height: 100vh;
      font-family: var(--font-body);
      color: var(--text);
      background:
        radial-gradient(circle at 10% 20%, rgba(255,255,255,.8) 0 40px, transparent 41px),
        radial-gradient(circle at 90% 80%, rgba(255,255,255,.7) 0 55px, transparent 56px),
        linear-gradient(135deg, #fff6f8, #ffecef 50%, #fff8f1);
      overflow-x: hidden;
    }

    button {
      font-family: var(--font-body);
    }

    /* =========================
       SCREEN
    ========================== */

    .screen {
      position: fixed;
      inset: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      transition:
        opacity .6s ease,
        transform .6s ease,
        visibility .6s ease;
    }

    .screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: scale(.97);
    }

    /* =========================
       LANDING
    ========================== */

    #landing {
      z-index: 10;
    }

    .landing-card {
      position: relative;
      width: min(520px, 100%);
      text-align: center;
      padding: 55px 30px;
      border-radius: 35px;
      background: rgba(255, 255, 255, .72);
      backdrop-filter: blur(12px);
      box-shadow: var(--shadow);
      border: 1px solid rgba(255,255,255,.8);
    }

    .flower {
      font-size: 48px;
      animation: floating 3s ease-in-out infinite;
      margin-bottom: 12px;
    }

    .landing-card h1 {
      font-family: var(--font-heading);
      color: var(--pink-dark);
      font-size: clamp(2.5rem, 8vw, 3.8rem);
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 16px;
    }

    .landing-card p {
      max-width: 380px;
      margin: 0 auto 30px;
      font-size: 0.95rem;
      line-height: 1.8;
      color: #78666c;
    }

    .start-btn {
      border: none;
      cursor: pointer;
      color: white;
      font-size: 1.05rem;
      font-weight: 700;
      padding: 15px 42px;
      border-radius: 999px;
      background: linear-gradient(135deg, #ee91aa, #d86f8e);
      box-shadow: 0 10px 25px rgba(216, 111, 142, .28);
      transition: transform .25s ease, box-shadow .25s ease;
    }

    .start-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 14px 30px rgba(216, 111, 142, .35);
    }

    .start-btn:active {
      transform: scale(.96);
    }

    /* =========================
       DECORATIONS
    ========================== */

    .decoration {
      position: absolute;
      font-size: 28px;
      pointer-events: none;
      animation: floating 4s ease-in-out infinite;
    }

    .d1 { top: 12%; left: 10%; }
    .d2 { top: 18%; right: 9%; animation-delay: .7s; }
    .d3 { bottom: 15%; left: 8%; animation-delay: 1.2s; }
    .d4 { bottom: 12%; right: 10%; animation-delay: 1.8s; }

    @keyframes floating {
      0%, 100% {
        transform: translateY(0) rotate(0deg);
      }
      50% {
        transform: translateY(-10px) rotate(4deg);
      }
    }

    /* =========================
       FRUIT SCREEN
    ========================== */

    #fruitScreen {
      position: relative;
      z-index: 1;
      overflow-y: auto;
      align-items: flex-start;
      padding-top: clamp(45px, 8vh, 90px);
      padding-bottom: 45px;
    }

    .fruit-container {
      width: min(900px, 100%);
      text-align: center;
    }

    .fruit-container h2 {
      font-family: var(--font-heading);
      color: var(--pink-dark);
      font-size: clamp(2.2rem, 6vw, 3.2rem);
      margin-bottom: 10px;
    }

    .subtitle {
      color: #826d74;
      font-size: .95rem;
      margin-bottom: 35px;
    }

    .fruit-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .fruit-card {
      border: 0;
      cursor: pointer;
      min-height: 150px;
      padding: 22px 12px;
      border-radius: 27px;
      background: rgba(255,255,255,.82);
      box-shadow: 0 10px 30px rgba(190,105,130,.11);
      color: var(--text);
      transition:
        transform .3s ease,
        box-shadow .3s ease,
        background .3s ease;
    }

    .fruit-card:hover {
      transform: translateY(-7px);
      box-shadow: 0 16px 35px rgba(190,105,130,.2);
      background: #fff;
    }

    .fruit-icon {
      display: block;
      font-size: 55px;
      margin-bottom: 10px;
      transition: transform .3s ease;
    }

    .fruit-card:hover .fruit-icon {
      transform: scale(1.12) rotate(4deg);
    }

    .fruit-name {
      font-size: 0.95rem;
      font-weight: 700;
      color: #6b555c;
    }

    /* =========================
       MODAL
    ========================== */

    .modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(86, 58, 67, .28);
      backdrop-filter: blur(7px);

      opacity: 0;
      visibility: hidden;
      transition: opacity .35s ease, visibility .35s ease;
    }

    .modal.active {
      opacity: 1;
      visibility: visible;
    }

    .verse-card {
      width: min(560px, 100%);
      position: relative;
      padding: 40px 30px 32px;
      border-radius: 32px;
      text-align: center;
      background:
        linear-gradient(145deg, #fffdf9, #fff2f5);
      box-shadow: 0 25px 70px rgba(80, 45, 56, .2);

      transform: translateY(20px) scale(.96);
      transition: transform .4s cubic-bezier(.2,.8,.2,1);
    }

    .modal.active .verse-card {
      transform: translateY(0) scale(1);
    }

    .close-btn {
      position: absolute;
      top: 14px;
      right: 17px;
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      font-size: 20px;
      color: #896b74;
      background: #ffe6ec;
      transition: transform .2s ease;
    }

    .close-btn:hover {
      transform: rotate(90deg);
    }

    .selected-fruit {
      font-size: 65px;
      margin-bottom: 10px;
      animation: pop .5s ease;
    }

    @keyframes pop {
      0% {
        transform: scale(.5);
        opacity: 0;
      }
      70% {
        transform: scale(1.12);
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .verse-card h3 {
      font-family: var(--font-heading);
      color: var(--pink-dark);
      font-size: 2rem;
      margin-bottom: 15px;
    }

    .verse-text {
      font-size: clamp(0.95rem, 3.2vw, 1.1rem);
      line-height: 1.8;
      color: #59494f;
      margin-bottom: 18px;
      white-space: pre-line;
    }

    .verse-reference {
      color: var(--pink-dark);
      font-weight: 700;
      font-size: .9rem;
      margin-bottom: 25px;
    }

    .another-btn {
      border: none;
      cursor: pointer;
      padding: 13px 28px;
      border-radius: 999px;
      color: white;
      font-weight: 700;
      background: linear-gradient(135deg, #ee91aa, #d86f8e);
      box-shadow: 0 8px 20px rgba(216,111,142,.23);
      transition: transform .2s ease;
    }

    .another-btn:hover {
      transform: translateY(-2px);
    }

    /* =========================
       RESPONSIVE
    ========================== */

    @media (max-width: 600px) {
      .screen {
        padding: 18px;
      }

      .landing-card {
        padding: 45px 22px;
        border-radius: 28px;
      }

      .fruit-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 13px;
      }

      .fruit-card {
        min-height: 135px;
        border-radius: 22px;
      }

      .fruit-icon {
        font-size: 47px;
      }

      #fruitScreen {
        padding-top: 35px;
      }

      .verse-card {
        padding: 35px 21px 27px;
        border-radius: 27px;
      }
    }

    @media (max-width: 360px) {
      .fruit-grid {
        gap: 10px;
      }

      .fruit-card {
        min-height: 125px;
      }

      .fruit-icon {
        font-size: 42px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       MÀN HÌNH 1
  ========================== -->

  <section id="landing" class="screen">
    <span class="decoration d1">🌸</span>
    <span class="decoration d2">✨</span>
    <span class="decoration d3">🌷</span>
    <span class="decoration d4">💗</span>

    <div class="landing-card">
      <div class="flower">🌸</div>

      <h1>Chào anh em đến với ấn phẩm KVA3</h1>

      <p>
        Một chút bình yên, một chút yêu thương
        và một lời nhắn nhủ từ Cha dành riêng cho anh em hôm nay. 💕
      </p>

      <button class="start-btn" id="startBtn">
        Bắt đầu ✨
      </button>
    </div>
  </section>


  <!-- =========================
       MÀN HÌNH 2
  ========================== -->

  <section id="fruitScreen" class="screen hidden">

    <div class="fruit-container">

      <h2>Hãy chọn một loại trái cây bạn thích 🌷</h2>

      <p class="subtitle">
        Biết đâu hôm nay Cha có một lời nhắn đặc biệt dành cho anh em 💗
      </p>

      <div class="fruit-grid">

        <button class="fruit-card" data-fruit="Táo" data-icon="🍎">
          <span class="fruit-icon">🍎</span>
          <span class="fruit-name">Táo</span>
        </button>

        <button class="fruit-card" data-fruit="Chuối" data-icon="🍌">
          <span class="fruit-icon">🍌</span>
          <span class="fruit-name">Chuối</span>
        </button>

        <button class="fruit-card" data-fruit="Nho" data-icon="🍇">
          <span class="fruit-icon">🍇</span>
          <span class="fruit-name">Nho</span>
        </button>

        <button class="fruit-card" data-fruit="Dâu tây" data-icon="🍓">
          <span class="fruit-icon">🍓</span>
          <span class="fruit-name">Dâu tây</span>
        </button>

        <button class="fruit-card" data-fruit="Cam" data-icon="🍊">
          <span class="fruit-icon">🍊</span>
          <span class="fruit-name">Cam</span>
        </button>

        <button class="fruit-card" data-fruit="Dưa hấu" data-icon="🍉">
          <span class="fruit-icon">🍉</span>
          <span class="fruit-name">Dưa hấu</span>
        </button>

      </div>
    </div>
  </section>


  <!-- =========================
       MODAL CÂU KINH THÁNH
  ========================== -->

  <div class="modal" id="verseModal">

    <div class="verse-card">

      <button class="close-btn" id="closeBtn" aria-label="Đóng">
        ×
      </button>

      <div class="selected-fruit" id="selectedFruit">
        🍎
      </div>

      <h3 id="fruitTitle">
        Một lời nhắn dành cho bạn 💗
      </h3>

      <p class="verse-text" id="verseText"></p>

      <p class="verse-reference" id="verseReference"></p>

      <button class="another-btn" id="anotherBtn">
        Chọn quả khác 🌸
      </button>

    </div>
  </div>


  <script>
    /* =====================================
       DANH SÁCH 15 CÂU KINH THÁNH
    ====================================== */

    const bibleVerses = [
      {
        text: "Tôi làm được mọi sự nhờ Đấng ban năng lực cho tôi.",
        reference: "Phi-líp 4:13"
      },
      {
        text: "Vì Đức Chúa Trời yêu thương thế gian đến nỗi đã ban Con Một của Ngài, hầu cho hễ ai tin Con ấy không bị hư mất mà được sự sống đời đời",
        reference: "Giăng 3:16"
      },
      {
        text: "Đừng sợ vì Ta ở với con,\nChớ kinh khiếp vì Ta là Đức Chúa Trời của con!\nTa sẽ làm cho con mạnh mẽ; phải, Ta sẽ giúp đỡ con,\nDùng tay phải công chính của Ta mà nắm giữ con.",
        reference: "Ê-sai 41:10"
      },
      {
        text: "Hãy hết lòng tin cậy Đức Giê-hô-va, Đừng nương cậy nơi sự thông sáng của con.",
        reference: "Châm ngôn 3:5"
      },
      {
        text: "Vậy, chớ lo lắng về ngày mai; vì ngày mai sẽ tự lo cho ngày mai. Sự nhọc nhằn ngày nào đủ cho ngày ấy.",
        reference: "Ma-thi-ơ 6:34"
      },
      {
        text: "Bạn thấy đó, đức tin đi đôi với hành động, và nhờ hành động mà đức tin trở nên trọn vẹn.",
        reference: "Gia-cơ 2:22"
      },
      {
        text: "Hãy trao gánh nặng của con cho Đức Giê-hô-va\nNgài sẽ nâng đỡ con;\nNgài sẽ chẳng bao giờ để người công chính bị rúng động.",
        reference: "Thi thiên 55:22"
      },
      {
        text: "Hãy mạnh dạn, thật can đảm và cẩn thận làm theo tất cả luật pháp mà Môi-se, đầy tớ Ta, đã truyền cho con; đừng xây qua bên phải hoặc bên trái, để con đi đâu cũng đều được thịnh vượng.",
        reference: "Giô-suê 1:7"
      },
      {
        text: "Chớ tham tiền, hãy hài lòng với những gì mình có, vì chính Đức Chúa Trời có phán: “Ta sẽ chẳng lìa con, chẳng bỏ con đâu.",
        reference: "Hê-bơ-rơ 13:5"
      },
      {
        text: "Hãy cảnh giác và tỉnh thức vì các con không biết giờ đó đến khi nào.",
        reference: "Mác 13:33"
      },
      {
        text: "Hễ ai tự tôn mình lên sẽ bị hạ xuống, còn người nào tự hạ mình xuống sẽ được tôn lên.",
        reference: "Ma-thi-ơ 23:12"
      },
      {
        text: "Các con sẽ bị mọi dân tộc thù ghét vì danh Ta, nhưng ai bền chí cho đến cuối cùng thì sẽ được cứu rỗi.",
        reference: "Ma-thi-ơ 10:22"
      },
      {
        text: "Nên bây giờ còn có ba điều nầy: Đức tin, hi vọng, tình yêu thương; nhưng điều cao trọng hơn cả là tình yêu thương.",
        reference: "I Cô-rinh-tô 13:13"
      },
      {
        text: "Hãy vui mừng mãi mãi, cầu nguyện không thôi; hãy cảm tạ Chúa trong mọi hoàn cảnh, vì đó là ý muốn của Đức Chúa Trời đối với anh em trong Đấng Christ Jêsus.",
        reference: "I Tê-sa-lô-ni-ca 5:16-18"
      },
      {
        text: "Đừng khuôn rập theo đời nầy, nhưng phải được biến hóa bởi sự đổi mới của tâm trí mình, để phân biệt đâu là ý muốn tốt đẹp, vừa lòng và trọn vẹn của Đức Chúa Trời.",
        reference: "Rô-ma 12:2"
      }
    ];


    /* =====================================
       CÁC PHẦN TỬ HTML
    ====================================== */

    const landing = document.getElementById("landing");
    const fruitScreen = document.getElementById("fruitScreen");

    const startBtn = document.getElementById("startBtn");

    const modal = document.getElementById("verseModal");
    const closeBtn = document.getElementById("closeBtn");
    const anotherBtn = document.getElementById("anotherBtn");

    const selectedFruit = document.getElementById("selectedFruit");
    const fruitTitle = document.getElementById("fruitTitle");
    const verseText = document.getElementById("verseText");
    const verseReference = document.getElementById("verseReference");

    const fruitCards = document.querySelectorAll(".fruit-card");


    /* =====================================
       BẮT ĐẦU
    ====================================== */

    startBtn.addEventListener("click", () => {

      landing.classList.add("hidden");

      setTimeout(() => {
        fruitScreen.classList.remove("hidden");
      }, 350);

    });


    /* =====================================
       HIỂN THỊ CÂU KINH
    ====================================== */

    function getRandomVerse() {

      const randomIndex =
        Math.floor(Math.random() * bibleVerses.length);

      return bibleVerses[randomIndex];
    }


    function openVerse(fruit, icon) {

      const verse = getRandomVerse();

      selectedFruit.textContent = icon;

      fruitTitle.textContent =
        `${fruit} hôm nay mang đến cho bạn 💗`;

      verseText.textContent =
        `“${verse.text}”`;

      verseReference.textContent =
        `— ${verse.reference}`;

      modal.classList.add("active");

      document.body.style.overflow = "hidden";
    }


    /* =====================================
       CLICK TRÁI CÂY
    ====================================== */

    fruitCards.forEach(card => {

      card.addEventListener("click", () => {

        const fruit = card.dataset.fruit;
        const icon = card.dataset.icon;

        openVerse(fruit, icon);

      });

    });


    /* =====================================
       ĐÓNG MODAL
    ====================================== */

    function closeModal() {

      modal.classList.remove("active");

      document.body.style.overflow = "";

    }


    closeBtn.addEventListener("click", closeModal);

    anotherBtn.addEventListener("click", closeModal);


    /* =====================================
       CLICK RA NGOÀI MODAL
    ====================================== */

    modal.addEventListener("click", (event) => {

      if (event.target === modal) {
        closeModal();
      }

    });


    /* =====================================
       PHÍM ESC ĐỂ ĐÓNG
    ====================================== */

    document.addEventListener("keydown", (event) => {

      if (event.key === "Escape") {
        closeModal();
      }

    });

  </script>

</body>
</html>
